---
# Плейбук верификации деплоя — проверяет что все контейнеры запущены и здоровы

- name: Verify connectivity
  hosts: matrix
  become: false
  gather_facts: false
  tasks:
    - name: Check host connectivity
      ping:

- name: Verify Docker is running (all non-haproxy hosts)
  hosts: matrix:!haproxy
  become: true
  tasks:
    - name: Docker daemon is active
      systemd:
        name: docker
      register: docker_status
      failed_when: docker_status.status.ActiveState != 'active'

- name: Verify PostgreSQL
  hosts: database
  become: true
  tasks:
    - name: Postgres container is running
      command: docker inspect -f '{{ "{{.State.Status}}" }}' matrix-postgres
      register: pg_state
      changed_when: false
      failed_when: pg_state.stdout != 'running'

    - name: Postgres accepts connections
      command: >
        docker exec matrix-postgres
        pg_isready -U postgres -h {{ postgres_ip }} -p {{ postgres_port }}
      changed_when: false

- name: Verify Redis
  hosts: redis_cluster
  become: true
  tasks:
    - name: Redis container is running
      command: docker inspect -f '{{ "{{.State.Status}}" }}' matrix-redis
      register: redis_state
      changed_when: false
      failed_when: redis_state.stdout != 'running'

    - name: Redis PING responds
      command: >
        docker exec matrix-redis
        redis-cli -h {{ redis_ip }} -p {{ redis_port }} -a {{ vault_redis_password }} PING
      register: redis_ping
      changed_when: false
      failed_when: "'PONG' not in redis_ping.stdout"
      no_log: true

- name: Verify Synapse
  hosts: synapse
  become: true
  tasks:
    - name: Synapse container is running
      command: docker inspect -f '{{ "{{.State.Status}}" }}' matrix-synapse
      register: synapse_state
      changed_when: false
      failed_when: synapse_state.stdout != 'running'

    - name: Synapse /health returns 200
      uri:
        url: "http://{{ synapse_ip }}:{{ synapse_http_port }}/health"
        status_code: 200

- name: Verify Workers
  hosts: workers
  become: true
  tasks:
    - name: All worker containers are running
      command: docker inspect -f '{{ "{{.State.Status}}" }}' synapse-{{ item.name }}
      register: worker_state
      changed_when: false
      failed_when: worker_state.stdout != 'running'
      loop: "{{ synapse_workers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: MAS container is running
      command: docker inspect -f '{{ "{{.State.Status}}" }}' matrix-mas
      register: mas_state
      changed_when: false
      failed_when: mas_state.stdout != 'running'

    - name: Synchrotron workers health
      uri:
        url: "http://{{ workers_ip }}:{{ item.port }}/health"
        status_code: 200
      loop: "{{ synapse_workers | selectattr('worker_name', 'match', '^synchrotron.*') | list }}"
      loop_control:
        label: "{{ item.name }}"

- name: Verify Coturn
  hosts: coturn
  become: true
  tasks:
    - name: Coturn container is running
      command: docker inspect -f '{{ "{{.State.Status}}" }}' matrix-coturn
      register: coturn_state
      changed_when: false
      failed_when: coturn_state.stdout != 'running'

- name: Verify LiveKit
  hosts: livekit
  become: true
  tasks:
    - name: LiveKit container is running
      command: docker inspect -f '{{ "{{.State.Status}}" }}' matrix-livekit
      register: livekit_state
      changed_when: false
      failed_when: livekit_state.stdout != 'running'

    - name: LK-JWT container is running
      command: docker inspect -f '{{ "{{.State.Status}}" }}' matrix-lk-jwt
      register: lkjwt_state
      changed_when: false
      failed_when: lkjwt_state.stdout != 'running'

- name: Verify Element Web
  hosts: element
  become: true
  tasks:
    - name: Element container is running
      command: docker inspect -f '{{ "{{.State.Status}}" }}' matrix-element
      register: element_state
      changed_when: false
      failed_when: element_state.stdout != 'running'

    - name: Element Web HTTP responds
      uri:
        url: "http://{{ element_ip }}:{{ element_nginx_port }}/"
        status_code: 200

- name: Verify HAProxy (native)
  hosts: haproxy
  become: true
  tasks:
    - name: HAProxy is running
      systemd:
        name: haproxy
      register: haproxy_status
      failed_when: haproxy_status.status.ActiveState != 'active'

    - name: HAProxy config is valid
      command: haproxy -c -f /etc/haproxy/haproxy.cfg
      changed_when: false
