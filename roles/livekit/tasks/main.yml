---
- name: Create LiveKit host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/matrix/livekit
    - /var/lib/matrix/livekit
    - /var/log/matrix/livekit

- name: Deploy livekit.yaml
  template:
    src: livekit.yaml.j2
    dest: /etc/matrix/livekit/livekit.yaml
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart livekit

- name: Start LiveKit container
  community.docker.docker_container:
    name: matrix-livekit
    image: "livekit/livekit-server:v{{ livekit_version }}"
    state: started
    restart_policy: unless-stopped
    # host network ОБЯЗАТЕЛЕН для WebRTC ICE — контейнер видит реальные интерфейсы хоста
    network_mode: host
    volumes:
      - "/etc/matrix/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro"
      - "/var/lib/matrix/livekit:/var/lib/livekit"
      - "/var/log/matrix/livekit:/var/log/livekit"
    command: ["--config", "/etc/livekit/livekit.yaml"]
    log_driver: json-file
    log_options:
      max-size: "100m"
      max-file: "5"
    ulimits:
      - nofile:65536:65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://{{ livekit_ip }}:{{ livekit_port }}/metrics || exit 1"]
      interval: "30s"
      timeout: "10s"
      retries: 3
      start_period: "15s"
    pull: "missing"

- name: Start lk-jwt container
  community.docker.docker_container:
    name: matrix-lk-jwt
    image: "ghcr.io/element-hq/lk-jwt-service:latest"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    env:
      LK_JWT_PORT: "{{ livekit_jwt_port }}"
      LK_JWT_LIVEKIT_URL: "ws://{{ livekit_ip }}:{{ livekit_port }}"
      LIVEKIT_API_KEY: "{{ vault_livekit_api_key }}"
      LIVEKIT_API_SECRET: "{{ vault_livekit_api_secret }}"
    log_driver: json-file
    log_options:
      max-size: "50m"
      max-file: "5"
    pull: "missing"
  notify: Restart lk-jwt
  no_log: true

- name: Allow LiveKit WebSocket from HAProxy (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ livekit_port }}"
    proto: tcp
    comment: "LiveKit WS from HAProxy"

- name: Allow lk-jwt from HAProxy (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ livekit_jwt_port }}"
    proto: tcp
    comment: "LiveKit JWT from HAProxy"

- name: Allow LiveKit WebRTC UDP (UFW)
  community.general.ufw:
    rule: allow
    port: "{{ livekit_rtc_port_udp }}"
    proto: udp
    comment: "LiveKit WebRTC UDP"

- name: Allow LiveKit WebRTC TCP fallback (UFW)
  community.general.ufw:
    rule: allow
    port: "{{ livekit_rtc_port_tcp }}"
    proto: tcp
    comment: "LiveKit WebRTC TCP fallback"
