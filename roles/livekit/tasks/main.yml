---
- name: Create LiveKit host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/matrix/livekit
    - /var/lib/matrix/livekit
    - /var/log/matrix/livekit

- name: Deploy livekit.yaml
  template:
    src: livekit.yaml.j2
    dest: /etc/matrix/livekit/livekit.yaml
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart livekit

- name: Deploy lk-jwt env file
  template:
    src: lk-jwt.env.j2
    dest: /etc/matrix/livekit/lk-jwt.env
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart lk-jwt

- name: Create Docker Compose directory for LiveKit
  file:
    path: "{{ docker_compose_dir }}/livekit"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy docker-compose.yml for LiveKit
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/livekit/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify:
    - Restart livekit
    - Restart lk-jwt

- name: Pull LiveKit images
  command: docker compose -f {{ docker_compose_dir }}/livekit/docker-compose.yml pull
  changed_when: false

- name: Start LiveKit containers
  command: docker compose -f {{ docker_compose_dir }}/livekit/docker-compose.yml up -d --remove-orphans
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"

- name: Allow LiveKit WebSocket from HAProxy (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ livekit_port }}"
    proto: tcp
    comment: "LiveKit WS from HAProxy"

- name: Allow lk-jwt from HAProxy (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ livekit_jwt_port }}"
    proto: tcp
    comment: "LiveKit JWT from HAProxy"

- name: Allow LiveKit WebRTC UDP (UFW)
  community.general.ufw:
    rule: allow
    port: "{{ livekit_rtc_port_udp }}"
    proto: udp
    comment: "LiveKit WebRTC UDP"

- name: Allow LiveKit WebRTC TCP fallback (UFW)
  community.general.ufw:
    rule: allow
    port: "{{ livekit_rtc_port_tcp }}"
    proto: tcp
    comment: "LiveKit WebRTC TCP fallback"
