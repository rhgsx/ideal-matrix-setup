---
- name: Create Element Web host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/matrix/element
    - /var/log/matrix/element

- name: Deploy Element Web config.json
  template:
    src: config.json.j2
    dest: /etc/matrix/element/config.json
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload element

- name: Deploy nginx config for Element
  template:
    src: nginx.conf.j2
    dest: /etc/matrix/element/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload element

- name: Start Element Web container
  community.docker.docker_container:
    name: matrix-element
    image: "vectorim/element-web:v{{ element_version }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - "/etc/matrix/element/config.json:/app/config.json:ro"
      - "/etc/matrix/element/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
      - "/var/log/matrix/element:/var/log/nginx"
    log_driver: json-file
    log_options:
      max-size: "50m"
      max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://{{ element_ip }}:{{ element_nginx_port }}/ || exit 1"]
      interval: "30s"
      timeout: "5s"
      retries: 3
      start_period: "10s"
    pull: "missing"

- name: Allow Element nginx from HAProxy (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ element_nginx_port }}"
    proto: tcp
    comment: "Element Web nginx from HAProxy"
