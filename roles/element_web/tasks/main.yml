---
- name: Create Element Web host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/matrix/element
    - /var/log/matrix/element

- name: Deploy Element Web config.json
  template:
    src: config.json.j2
    dest: /etc/matrix/element/config.json
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload element

- name: Deploy nginx config for Element
  template:
    src: nginx.conf.j2
    dest: /etc/matrix/element/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload element

- name: Create Docker Compose directory for Element
  file:
    path: "{{ docker_compose_dir }}/element"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy docker-compose.yml for Element Web
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/element/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Reload element

- name: Pull Element Web image
  command: docker compose -f {{ docker_compose_dir }}/element/docker-compose.yml pull
  changed_when: false

- name: Start Element Web container
  command: docker compose -f {{ docker_compose_dir }}/element/docker-compose.yml up -d --remove-orphans
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"

- name: Allow Element nginx from HAProxy (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ element_nginx_port }}"
    proto: tcp
    comment: "Element Web nginx from HAProxy"
