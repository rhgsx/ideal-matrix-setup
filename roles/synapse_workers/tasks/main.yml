---
- name: Create worker host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0750"
  loop:
    - "{{ workers_config_dir }}"
    - "{{ workers_log_dir }}"
    - "{{ synapse_data_dir }}"
    - "{{ synapse_data_dir }}/media_store"

- name: Deploy shared homeserver.yaml for workers
  template:
    src: homeserver-worker-base.yaml.j2
    dest: "{{ synapse_config_dir }}/homeserver.yaml"
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0640"
    backup: true
  notify: Restart all workers

- name: Deploy per-worker config files
  template:
    src: worker.yaml.j2
    dest: "{{ workers_config_dir }}/{{ item.name }}.yaml"
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0640"
  loop: "{{ synapse_workers }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart all workers

- name: Deploy per-worker log configs
  template:
    src: worker-log.config.j2
    dest: "{{ workers_config_dir }}/{{ item.name }}.log.config"
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0640"
  loop: "{{ synapse_workers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check signing key presence
  stat:
    path: "{{ synapse_config_dir }}/{{ matrix_server_name }}.signing.key"
  register: signing_key_stat

- name: Warn if signing key is missing
  debug:
    msg: >
      ВНИМАНИЕ: Скопируйте signing key с synapse01:
      scp {{ synapse_ip }}:{{ synapse_config_dir }}/{{ matrix_server_name }}.signing.key
          {{ synapse_config_dir }}/{{ matrix_server_name }}.signing.key
  when: not signing_key_stat.stat.exists

- name: Pull Synapse image for workers
  community.docker.docker_image:
    name: "ghcr.io/element-hq/synapse"
    tag: "v{{ synapse_version }}"
    source: pull
    force_source: false

- name: Start worker containers
  community.docker.docker_container:
    name: "synapse-{{ item.name }}"
    image: "ghcr.io/element-hq/synapse:v{{ synapse_version }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    user: "{{ matrix_uid }}:{{ matrix_gid }}"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - "{{ synapse_config_dir }}:{{ synapse_config_dir }}:ro"
      - "{{ workers_config_dir }}:{{ workers_config_dir }}:ro"
      - "{{ synapse_data_dir }}:{{ synapse_data_dir }}"
      - "{{ workers_log_dir }}:{{ workers_log_dir }}"
    command:
      - python3
      - -m
      - "{{ item.app }}"
      - "--config-path={{ synapse_config_dir }}/homeserver.yaml"
      - "--config-path={{ workers_config_dir }}/{{ item.name }}.yaml"
    log_driver: json-file
    log_options:
      max-size: "50m"
      max-file: "5"
    ulimits:
      - nofile:65536:65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://{{ workers_ip }}:{{ item.port }}/health || exit 1"]
      interval: "30s"
      timeout: "10s"
      retries: 3
      start_period: "30s"
    pull: "never"   # image already pulled in previous task
  loop: "{{ synapse_workers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Wait for synchrotron workers to be ready
  uri:
    url: "http://{{ workers_ip }}:{{ item.port }}/health"
    status_code: 200
  register: worker_health
  until: worker_health.status == 200
  retries: 20
  delay: 3
  loop: "{{ synapse_workers | selectattr('worker_name', 'match', '^synchrotron.*') | list }}"
  loop_control:
    label: "{{ item.name }}"

# UFW — HAProxy → workers с HTTP listener (client или federation)
- name: Allow worker HTTP ports from HAProxy
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ item.port }}"
    proto: tcp
    comment: "Worker {{ item.name }} from HAProxy"
  loop: "{{ synapse_workers }}"
  loop_control:
    label: "{{ item.name }}"
  when: "'client' in item.listener_resources or 'federation' in item.listener_resources or 'media' in item.listener_resources"

# UFW — synapse01 → replication workers
- name: Allow replication ports from Synapse main
  community.general.ufw:
    rule: allow
    src: "{{ synapse_ip }}"
    port: "{{ item.port }}"
    proto: tcp
    comment: "Replication worker {{ item.name }}"
  loop: "{{ synapse_workers }}"
  loop_control:
    label: "{{ item.name }}"
  when: "'replication' in item.listener_resources"
