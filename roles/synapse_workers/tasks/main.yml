---
- name: Create worker host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0750"
  loop:
    - "{{ workers_config_dir }}"
    - "{{ workers_log_dir }}"
    - "{{ synapse_data_dir }}"
    - "{{ synapse_data_dir }}/media_store"

- name: Deploy shared homeserver.yaml for workers
  template:
    src: homeserver-worker-base.yaml.j2
    dest: "{{ synapse_config_dir }}/homeserver.yaml"
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0640"
    backup: true
  notify: Restart all workers

- name: Deploy per-worker config files
  template:
    src: worker.yaml.j2
    dest: "{{ workers_config_dir }}/{{ item.name }}.yaml"
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0640"
  loop: "{{ synapse_workers }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart all workers

- name: Deploy per-worker log configs
  template:
    src: worker-log.config.j2
    dest: "{{ workers_config_dir }}/{{ item.name }}.log.config"
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0640"
  loop: "{{ synapse_workers }}"
  loop_control:
    label: "{{ item.name }}"

- name: Copy signing key from synapse01 to workers01
  # Signing key должен быть идентичен на обоих хостах
  # Выполняется только если ключ ещё не скопирован
  stat:
    path: "{{ synapse_config_dir }}/{{ matrix_server_name }}.signing.key"
  register: signing_key_stat

- name: Warn if signing key is missing
  debug:
    msg: >
      ВНИМАНИЕ: Скопируйте signing key с synapse01:
      scp {{ synapse_ip }}:{{ synapse_config_dir }}/{{ matrix_server_name }}.signing.key
          {{ synapse_config_dir }}/{{ matrix_server_name }}.signing.key
  when: not signing_key_stat.stat.exists

- name: Create Docker Compose directory for workers
  file:
    path: "{{ docker_compose_dir }}/workers"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy docker-compose.yml for all workers
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/workers/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart all workers

- name: Pull Synapse image for workers
  command: docker compose -f {{ docker_compose_dir }}/workers/docker-compose.yml pull
  changed_when: false

- name: Start all worker containers
  command: docker compose -f {{ docker_compose_dir }}/workers/docker-compose.yml up -d --remove-orphans
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"

- name: Wait for synchrotron workers to be ready
  uri:
    url: "http://{{ workers_ip }}:{{ item.port }}/health"
    status_code: 200
  register: worker_health
  until: worker_health.status == 200
  retries: 20
  delay: 3
  loop: "{{ synapse_workers | selectattr('worker_name', 'match', '^synchrotron.*') | list }}"
  loop_control:
    label: "{{ item.name }}"

# UFW — HAProxy → workers с HTTP/federation listener
- name: Allow worker HTTP ports from HAProxy
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ item.port }}"
    proto: tcp
    comment: "Worker {{ item.name }} from HAProxy"
  loop: "{{ synapse_workers }}"
  loop_control:
    label: "{{ item.name }}"
  when: >
    item.worker_listeners | selectattr('resources', 'contains', 'client') | list | length > 0
    or
    item.worker_listeners | selectattr('resources', 'contains', 'federation') | list | length > 0

# UFW — synapse01 → replication workers
- name: Allow replication ports from Synapse main
  community.general.ufw:
    rule: allow
    src: "{{ synapse_ip }}"
    port: "{{ item.port }}"
    proto: tcp
    comment: "Replication worker {{ item.name }}"
  loop: "{{ synapse_workers }}"
  loop_control:
    label: "{{ item.name }}"
  when: >
    item.worker_listeners | selectattr('resources', 'contains', 'replication') | list | length > 0
