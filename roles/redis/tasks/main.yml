---
- name: Add Redis official APT repository key
  apt_key:
    url: "https://packages.redis.io/gpg"
    keyring: /usr/share/keyrings/redis-archive-keyring.gpg
    state: present

- name: Add Redis APT repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb {{ ansible_distribution_release }} main"
    state: present
    filename: redis

- name: Install Redis
  apt:
    name:
      - "redis-server"
      - "redis-tools"
    state: present
    update_cache: true

- name: Create Redis directories
  file:
    path: "{{ item }}"
    state: directory
    owner: redis
    group: redis
    mode: "0750"
  loop:
    - "{{ redis_data_dir }}"
    - "{{ redis_log_dir }}"

- name: Deploy redis.conf
  template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"
    backup: true
  notify: Restart redis

- name: Deploy redis systemd override (ulimits)
  template:
    src: redis-override.conf.j2
    dest: /etc/systemd/system/redis-server.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart redis

- name: Create systemd override directory for redis
  file:
    path: /etc/systemd/system/redis-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Enable and start Redis
  systemd:
    name: redis-server
    enabled: true
    state: started
    daemon_reload: true

- name: Allow Redis port from Synapse and workers
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "{{ redis_port }}"
    proto: tcp
    comment: "Redis from matrix hosts"
  loop:
    - "{{ synapse_ip }}"
    - "{{ workers_ip }}"
