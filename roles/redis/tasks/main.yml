---
- name: Create Redis host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: 999      # UID redis внутри redis:alpine
    group: 999
    mode: "0750"
  loop:
    - "{{ redis_data_dir }}"
    - "{{ redis_log_dir }}"
    - /etc/matrix/redis

- name: Deploy redis.conf
  template:
    src: redis.conf.j2
    dest: /etc/matrix/redis/redis.conf
    owner: 999
    group: 999
    mode: "0640"
    backup: true
  notify: Restart redis

- name: Create Docker Compose directory
  file:
    path: "{{ docker_compose_dir }}/redis"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy docker-compose.yml for Redis
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/redis/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart redis

- name: Pull Redis image
  command: docker compose -f {{ docker_compose_dir }}/redis/docker-compose.yml pull
  changed_when: false

- name: Start Redis container
  command: docker compose -f {{ docker_compose_dir }}/redis/docker-compose.yml up -d --remove-orphans
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"

- name: Wait for Redis to accept connections
  command: >
    docker exec matrix-redis
    redis-cli -h {{ redis_ip }} -p {{ redis_port }} -a {{ vault_redis_password }} PING
  register: redis_ping
  until: "'PONG' in redis_ping.stdout"
  retries: 20
  delay: 2
  changed_when: false
  no_log: true

- name: Allow Redis from Synapse and workers (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "{{ redis_port }}"
    proto: tcp
    comment: "Redis from matrix hosts"
  loop:
    - "{{ synapse_ip }}"
    - "{{ workers_ip }}"
