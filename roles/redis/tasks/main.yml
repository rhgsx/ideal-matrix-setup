---
- name: Create Redis host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: 999      # UID redis внутри redis:alpine
    group: 999
    mode: "0750"
  loop:
    - "{{ redis_data_dir }}"
    - "{{ redis_log_dir }}"
    - /etc/matrix/redis

- name: Deploy redis.conf
  template:
    src: redis.conf.j2
    dest: /etc/matrix/redis/redis.conf
    owner: 999
    group: 999
    mode: "0640"
    backup: true
  notify: Restart redis

- name: Start Redis container
  community.docker.docker_container:
    name: matrix-redis
    image: "redis:{{ redis_version }}-alpine"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    volumes:
      - "/etc/matrix/redis/redis.conf:/etc/redis/redis.conf:ro"
      - "{{ redis_data_dir }}:/var/lib/redis"
      - "{{ redis_log_dir }}:/var/log/redis"
    command: ["redis-server", "/etc/redis/redis.conf"]
    log_driver: json-file
    log_options:
      max-size: "50m"
      max-file: "5"
    ulimits:
      - nofile:65536:65536
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "{{ redis_ip }}", "-p", "{{ redis_port }}", "-a", "{{ vault_redis_password }}", "PING"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "10s"
    pull: "missing"

- name: Wait for Redis to accept connections
  command: >
    docker exec matrix-redis
    redis-cli -h {{ redis_ip }} -p {{ redis_port }} -a {{ vault_redis_password }} PING
  register: redis_ping
  until: "'PONG' in redis_ping.stdout"
  retries: 20
  delay: 2
  changed_when: false
  no_log: true

- name: Allow Redis from Synapse and workers (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "{{ redis_port }}"
    proto: tcp
    comment: "Redis from matrix hosts"
  loop:
    - "{{ synapse_ip }}"
    - "{{ workers_ip }}"
