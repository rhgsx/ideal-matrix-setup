---
- name: Create MAS host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0750"
  loop:
    - /etc/matrix/mas
    - /var/lib/matrix/mas
    - /var/log/matrix/mas

- name: Deploy MAS config
  template:
    src: config.yaml.j2
    dest: /etc/matrix/mas/config.yaml
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0640"
    backup: true
  notify: Restart mas

- name: Create Docker Compose directory for MAS
  file:
    path: "{{ docker_compose_dir }}/mas"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy docker-compose.yml for MAS
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/mas/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart mas

- name: Pull MAS image
  command: docker compose -f {{ docker_compose_dir }}/mas/docker-compose.yml pull
  changed_when: false

- name: Run MAS database migrations
  command: >
    docker run --rm
    --network host
    --user {{ matrix_uid }}:{{ matrix_gid }}
    -v /etc/matrix/mas:/etc/mas:ro
    -v /var/lib/matrix/mas:/var/lib/mas
    ghcr.io/element-hq/matrix-authentication-service:{{ mas_version }}
    database migrate --config /etc/mas/config.yaml
  register: mas_migrate
  changed_when: "'Applied' in mas_migrate.stdout"

- name: Start MAS container
  command: docker compose -f {{ docker_compose_dir }}/mas/docker-compose.yml up -d --remove-orphans
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"

- name: Wait for MAS to become healthy
  uri:
    url: "http://{{ workers_ip }}:{{ mas_port }}/_health"
    status_code: 200
  register: mas_health
  until: mas_health.status == 200
  retries: 20
  delay: 3

- name: Allow MAS port from HAProxy (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ mas_port }}"
    proto: tcp
    comment: "MAS from HAProxy"
