---
- name: Create MAS host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0750"
  loop:
    - /etc/matrix/mas
    - /var/lib/matrix/mas
    - /var/log/matrix/mas

- name: Deploy MAS config
  template:
    src: config.yaml.j2
    dest: /etc/matrix/mas/config.yaml
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0640"
    backup: true
  notify: Restart mas

- name: Run MAS database migrations
  command: >
    docker run --rm
    --network host
    --user {{ matrix_uid }}:{{ matrix_gid }}
    -v /etc/matrix/mas:/etc/mas:ro
    -v /var/lib/matrix/mas:/var/lib/mas
    ghcr.io/element-hq/matrix-authentication-service:{{ mas_version }}
    database migrate --config /etc/mas/config.yaml
  register: mas_migrate
  changed_when: "'Applied' in mas_migrate.stdout"

- name: Start MAS container
  community.docker.docker_container:
    name: matrix-mas
    image: "ghcr.io/element-hq/matrix-authentication-service:{{ mas_version }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    user: "{{ matrix_uid }}:{{ matrix_gid }}"
    volumes:
      - "/etc/matrix/mas:/etc/mas:ro"
      - "/var/lib/matrix/mas:/var/lib/mas"
      - "/var/log/matrix/mas:/var/log/mas"
    command: ["server", "--config", "/etc/mas/config.yaml"]
    log_driver: json-file
    log_options:
      max-size: "50m"
      max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://{{ workers_ip }}:{{ mas_port }}/_health || exit 1"]
      interval: "30s"
      timeout: "10s"
      retries: 3
      start_period: "30s"
    pull: "missing"

- name: Wait for MAS to become healthy
  uri:
    url: "http://{{ workers_ip }}:{{ mas_port }}/_health"
    status_code: 200
  register: mas_health
  until: mas_health.status == 200
  retries: 20
  delay: 3

- name: Allow MAS port from HAProxy (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ mas_port }}"
    proto: tcp
    comment: "MAS from HAProxy"
