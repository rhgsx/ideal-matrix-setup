---
- name: Create Coturn host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/matrix/coturn
    - /var/lib/matrix/coturn
    - /var/log/matrix/coturn
    - /etc/ssl/matrix

- name: Deploy turnserver.conf
  template:
    src: turnserver.conf.j2
    dest: /etc/matrix/coturn/turnserver.conf
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart coturn

- name: Start Coturn container
  community.docker.docker_container:
    name: matrix-coturn
    image: "coturn/coturn:latest"
    state: started
    restart_policy: unless-stopped
    # host network ОБЯЗАТЕЛЕН для TURN relay — relay-ip привязывается к реальному интерфейсу
    network_mode: host
    volumes:
      - "/etc/matrix/coturn:/etc/turnserver:ro"
      - "/etc/ssl/matrix:/etc/ssl/matrix:ro"
      - "/var/lib/matrix/coturn:/var/lib/coturn"
      - "/var/log/matrix/coturn:/var/log/coturn"
    command: ["-c", "/etc/turnserver/turnserver.conf"]
    log_driver: json-file
    log_options:
      max-size: "50m"
      max-file: "5"
    ulimits:
      - nofile:65536:65536
    pull: "missing"

# UFW — STUN/TURN открыты для внешних клиентов (NAT → coturn01)
- name: Allow STUN/TURN ports (UFW)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop:
    - { port: "{{ coturn_port }}",     proto: tcp, comment: "TURN TCP" }
    - { port: "{{ coturn_port }}",     proto: udp, comment: "TURN UDP" }
    - { port: "{{ coturn_tls_port }}", proto: tcp, comment: "TURNS TLS TCP" }
    - { port: "{{ coturn_tls_port }}", proto: udp, comment: "TURNS DTLS UDP" }

- name: Allow TURN relay port range UDP (UFW)
  community.general.ufw:
    rule: allow
    port: "{{ coturn_min_port }}:{{ coturn_max_port }}"
    proto: udp
    comment: "TURN relay UDP"
