---
- name: Create Coturn host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/matrix/coturn
    - /var/lib/matrix/coturn
    - /var/log/matrix/coturn
    - /etc/ssl/matrix

- name: Deploy turnserver.conf
  template:
    src: turnserver.conf.j2
    dest: /etc/matrix/coturn/turnserver.conf
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart coturn

- name: Create Docker Compose directory for Coturn
  file:
    path: "{{ docker_compose_dir }}/coturn"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy docker-compose.yml for Coturn
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/coturn/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart coturn

- name: Pull Coturn image
  command: docker compose -f {{ docker_compose_dir }}/coturn/docker-compose.yml pull
  changed_when: false

- name: Start Coturn container
  command: docker compose -f {{ docker_compose_dir }}/coturn/docker-compose.yml up -d --remove-orphans
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"

# UFW — TURN/STUN открыты для внешних клиентов (NAT → coturn01)
- name: Allow STUN/TURN ports (UFW)
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop:
    - { port: "{{ coturn_port }}",     proto: tcp, comment: "TURN TCP" }
    - { port: "{{ coturn_port }}",     proto: udp, comment: "TURN UDP" }
    - { port: "{{ coturn_tls_port }}", proto: tcp, comment: "TURNS TLS TCP" }
    - { port: "{{ coturn_tls_port }}", proto: udp, comment: "TURNS DTLS UDP" }

- name: Allow TURN relay port range UDP (UFW)
  community.general.ufw:
    rule: allow
    port: "{{ coturn_min_port }}:{{ coturn_max_port }}"
    proto: udp
    comment: "TURN relay UDP"
