---
- name: Install coturn
  apt:
    name: coturn
    state: present
    update_cache: true

- name: Create coturn directories
  file:
    path: "{{ item }}"
    state: directory
    owner: turnserver
    group: turnserver
    mode: "0750"
  loop:
    - "{{ coturn_config_dir }}"
    - "{{ coturn_log_dir }}"
    - "{{ coturn_data_dir }}"
    - /var/run/coturn

- name: Enable coturn service
  lineinfile:
    path: /etc/default/coturn
    regexp: "^#?TURNSERVER_ENABLED="
    line: "TURNSERVER_ENABLED=1"

- name: Deploy turnserver.conf
  template:
    src: turnserver.conf.j2
    dest: /etc/turnserver.conf
    owner: turnserver
    group: turnserver
    mode: "0640"
    backup: true
  notify: Restart coturn

- name: Deploy coturn systemd override
  file:
    path: /etc/systemd/system/coturn.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Coturn systemd hardening
  copy:
    dest: /etc/systemd/system/coturn.service.d/override.conf
    content: |
      [Service]
      LimitNOFILE=65536
      LimitNPROC=65536
      ProtectSystem=strict
      ReadWritePaths={{ coturn_log_dir }} {{ coturn_data_dir }} /var/run/coturn
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart coturn

- name: Enable and start coturn
  systemd:
    name: coturn
    enabled: true
    state: started
    daemon_reload: true

# UFW — TURN/STUN порты открываются для ВНЕШНИХ клиентов (через NAT)
- name: Allow STUN/TURN UDP and TCP
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop:
    - { port: "{{ coturn_port }}",     proto: tcp, comment: "TURN TCP" }
    - { port: "{{ coturn_port }}",     proto: udp, comment: "TURN UDP" }
    - { port: "{{ coturn_tls_port }}", proto: tcp, comment: "TURNS TCP" }
    - { port: "{{ coturn_tls_port }}", proto: udp, comment: "TURNS UDP" }

- name: Allow TURN relay port range (UDP)
  community.general.ufw:
    rule: allow
    port: "{{ coturn_min_port }}:{{ coturn_max_port }}"
    proto: udp
    comment: "TURN relay UDP ports"
