---
- name: Create Synapse host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0750"
  loop:
    - "{{ synapse_config_dir }}"
    - "{{ synapse_data_dir }}"
    - "{{ synapse_data_dir }}/media_store"
    - "{{ synapse_data_dir }}/uploads"
    - "{{ synapse_log_dir }}"

- name: Deploy homeserver.yaml
  template:
    src: homeserver.yaml.j2
    dest: "{{ synapse_config_dir }}/homeserver.yaml"
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0640"
    backup: true
  notify: Restart synapse

- name: Deploy log.config
  template:
    src: log.config.j2
    dest: "{{ synapse_config_dir }}/log.config"
    owner: "{{ matrix_uid }}"
    group: "{{ matrix_gid }}"
    mode: "0640"
  notify: Restart synapse

- name: Generate Synapse signing key (if absent)
  command: >
    docker run --rm
    --user {{ matrix_uid }}:{{ matrix_gid }}
    -v {{ synapse_config_dir }}:{{ synapse_config_dir }}
    -v {{ synapse_data_dir }}:{{ synapse_data_dir }}
    ghcr.io/element-hq/synapse:v{{ synapse_version }}
    generate --server-name {{ matrix_server_name }} --config-dir {{ synapse_config_dir }}
  args:
    creates: "{{ synapse_config_dir }}/{{ matrix_server_name }}.signing.key"

- name: Start Synapse container
  community.docker.docker_container:
    name: matrix-synapse
    image: "ghcr.io/element-hq/synapse:v{{ synapse_version }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    user: "{{ matrix_uid }}:{{ matrix_gid }}"
    env:
      SYNAPSE_CONFIG_PATH: "{{ synapse_config_dir }}/homeserver.yaml"
      SYNAPSE_SERVER_NAME: "{{ matrix_server_name }}"
      SYNAPSE_REPORT_STATS: "no"
    volumes:
      - "{{ synapse_config_dir }}:{{ synapse_config_dir }}:ro"
      - "{{ synapse_data_dir }}:{{ synapse_data_dir }}"
      - "{{ synapse_log_dir }}:{{ synapse_log_dir }}"
    log_driver: json-file
    log_options:
      max-size: "100m"
      max-file: "5"
    ulimits:
      - nofile:65536:65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://{{ synapse_ip }}:{{ synapse_http_port }}/health || exit 1"]
      interval: "30s"
      timeout: "10s"
      retries: 3
      start_period: "60s"
    pull: "missing"

- name: Wait for Synapse to become healthy
  uri:
    url: "http://{{ synapse_ip }}:{{ synapse_http_port }}/health"
    status_code: 200
  register: synapse_health
  until: synapse_health.status == 200
  retries: 30
  delay: 5

- name: Allow Synapse HTTP from HAProxy (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ haproxy_ip }}"
    port: "{{ synapse_http_port }}"
    proto: tcp
    comment: "Synapse HTTP from HAProxy"

- name: Allow Synapse replication from workers (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ workers_ip }}"
    port: "{{ synapse_replication_port }}"
    proto: tcp
    comment: "Synapse replication from workers"
