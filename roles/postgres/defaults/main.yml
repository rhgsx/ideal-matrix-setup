---
postgres_version:     "16"
postgres_port:        5432
# На хосте данные хранятся здесь (монтируются в контейнер)
postgres_data_dir:    "/var/lib/matrix/postgres/data"
postgres_config_dir:  "/etc/matrix/postgres"

pg_max_connections:               200
pg_shared_buffers:                "2GB"
pg_effective_cache_size:          "6GB"
pg_maintenance_work_mem:          "512MB"
pg_checkpoint_completion_target:  0.9
pg_wal_buffers:                   "16MB"
pg_default_statistics_target:     100
pg_random_page_cost:              1.1
pg_effective_io_concurrency:      200
pg_work_mem:                      "10MB"
pg_huge_pages:                    "off"
pg_min_wal_size:                  "2GB"
pg_max_wal_size:                  "8GB"
pg_max_worker_processes:          8
pg_max_parallel_workers:          8
pg_max_parallel_workers_per_gather: 4
pg_max_parallel_maintenance_workers: 4
pg_wal_level:                     "replica"
pg_max_wal_senders:               5
pg_synchronous_commit:            "off"
pg_allowed_networks:
  - "{{ synapse_ip }}/32"
  - "{{ workers_ip }}/32"
