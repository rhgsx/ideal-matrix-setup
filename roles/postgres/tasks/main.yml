---
- name: Install PostgreSQL repo key
  apt:
    deb: "https://apt.postgresql.org/pub/repos/apt/pool/main/p/pgdg-keyring/pgdg-keyring_2018.2_all.deb"
    state: present

- name: Add PostgreSQL APT repository
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Add PostgreSQL GPG key
  apt_key:
    url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
    keyring: /usr/share/keyrings/postgresql.gpg
    state: present

- name: Install PostgreSQL {{ postgres_version }}
  apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-client-{{ postgres_version }}"
      - "python3-psycopg2"
    state: present
    update_cache: true

- name: Ensure PostgreSQL is started
  systemd:
    name: postgresql
    state: started
    enabled: true

- name: Deploy postgresql.conf
  template:
    src: postgresql.conf.j2
    dest: "{{ postgres_config_dir }}/postgresql.conf"
    owner: postgres
    group: postgres
    mode: "0640"
    backup: true
  notify: Restart postgresql

- name: Deploy pg_hba.conf
  template:
    src: pg_hba.conf.j2
    dest: "{{ postgres_config_dir }}/pg_hba.conf"
    owner: postgres
    group: postgres
    mode: "0640"
    backup: true
  notify: Reload postgresql

- name: Create Synapse database role
  community.postgresql.postgresql_user:
    name: "{{ synapse_db_user }}"
    password: "{{ vault_synapse_db_password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE
    state: present
  become_user: postgres

- name: Create Synapse database
  community.postgresql.postgresql_db:
    name: "{{ synapse_db_name }}"
    owner: "{{ synapse_db_user }}"
    encoding: UTF8
    lc_collate: C
    lc_ctype: C
    template: template0
    state: present
  become_user: postgres

- name: Grant Synapse user privileges
  community.postgresql.postgresql_privs:
    database: "{{ synapse_db_name }}"
    privs: ALL
    type: database
    role: "{{ synapse_db_user }}"
    state: present
  become_user: postgres

- name: Create MAS database role
  community.postgresql.postgresql_user:
    name: "{{ mas_db_user }}"
    password: "{{ vault_mas_db_password }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE
    state: present
  become_user: postgres

- name: Create MAS database
  community.postgresql.postgresql_db:
    name: "{{ mas_db_name }}"
    owner: "{{ mas_db_user }}"
    encoding: UTF8
    lc_collate: C
    lc_ctype: C
    template: template0
    state: present
  become_user: postgres

- name: Grant MAS user privileges
  community.postgresql.postgresql_privs:
    database: "{{ mas_db_name }}"
    privs: ALL
    type: database
    role: "{{ mas_db_user }}"
    state: present
  become_user: postgres

- name: Open PostgreSQL port in UFW from Synapse
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "{{ postgres_port }}"
    proto: tcp
    comment: "PostgreSQL from matrix hosts"
  loop:
    - "{{ synapse_ip }}"
    - "{{ workers_ip }}"
