---
- name: Create postgres host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: 999        # UID postgres внутри официального образа postgres:alpine
    group: 999
    mode: "0750"
  loop:
    - "{{ postgres_data_dir }}"
    - "{{ postgres_config_dir }}"
    - /var/log/matrix/postgres

- name: Deploy postgresql.conf
  template:
    src: postgresql.conf.j2
    dest: "{{ postgres_config_dir }}/postgresql.conf"
    owner: 999
    group: 999
    mode: "0640"
    backup: true
  notify: Restart postgres

- name: Deploy pg_hba.conf
  template:
    src: pg_hba.conf.j2
    dest: "{{ postgres_config_dir }}/pg_hba.conf"
    owner: 999
    group: 999
    mode: "0640"
    backup: true
  notify: Reload postgres

- name: Deploy database init SQL
  template:
    src: init-matrix.sql.j2
    dest: "{{ postgres_config_dir }}/init-matrix.sql"
    owner: 999
    group: 999
    mode: "0640"

- name: Create Docker Compose directory
  file:
    path: "{{ docker_compose_dir }}/postgres"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy docker-compose.yml for postgres
  template:
    src: docker-compose.yml.j2
    dest: "{{ docker_compose_dir }}/postgres/docker-compose.yml"
    owner: root
    group: root
    mode: "0640"
    backup: true
  notify: Restart postgres

- name: Pull PostgreSQL image
  command: docker compose -f {{ docker_compose_dir }}/postgres/docker-compose.yml pull
  changed_when: false

- name: Start PostgreSQL container
  command: docker compose -f {{ docker_compose_dir }}/postgres/docker-compose.yml up -d --remove-orphans
  register: compose_up
  changed_when: "'Started' in compose_up.stdout or 'Created' in compose_up.stdout"

- name: Wait for PostgreSQL to accept connections
  command: >
    docker exec matrix-postgres
    pg_isready -U postgres -h {{ postgres_ip }} -p {{ postgres_port }}
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 20
  delay: 3
  changed_when: false

- name: Allow PostgreSQL from Synapse and workers (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "{{ postgres_port }}"
    proto: tcp
    comment: "PostgreSQL from matrix hosts"
  loop:
    - "{{ synapse_ip }}"
    - "{{ workers_ip }}"
