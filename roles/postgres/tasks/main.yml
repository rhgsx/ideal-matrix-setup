---
- name: Create postgres host directories
  file:
    path: "{{ item }}"
    state: directory
    owner: 999        # UID postgres внутри официального образа postgres:alpine
    group: 999
    mode: "0750"
  loop:
    - "{{ postgres_data_dir }}"
    - "{{ postgres_config_dir }}"
    - /var/log/matrix/postgres

- name: Deploy postgresql.conf
  template:
    src: postgresql.conf.j2
    dest: "{{ postgres_config_dir }}/postgresql.conf"
    owner: 999
    group: 999
    mode: "0640"
    backup: true
  notify: Restart postgres

- name: Deploy pg_hba.conf
  template:
    src: pg_hba.conf.j2
    dest: "{{ postgres_config_dir }}/pg_hba.conf"
    owner: 999
    group: 999
    mode: "0640"
    backup: true
  notify: Reload postgres

- name: Deploy database init SQL
  template:
    src: init-matrix.sql.j2
    dest: "{{ postgres_config_dir }}/init-matrix.sql"
    owner: 999
    group: 999
    mode: "0640"

- name: Start PostgreSQL container
  community.docker.docker_container:
    name: matrix-postgres
    image: "postgres:{{ postgres_version }}-alpine"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "{{ vault_postgres_admin_password }}"
      POSTGRES_INITDB_ARGS: "--lc-collate=C --lc-ctype=C --encoding=UTF8"
      PGDATA: /var/lib/postgresql/data
    volumes:
      - "{{ postgres_data_dir }}:/var/lib/postgresql/data"
      - "{{ postgres_config_dir }}/postgresql.conf:/tmp/postgresql.conf:ro"
      - "{{ postgres_config_dir }}/pg_hba.conf:/tmp/pg_hba.conf:ro"
      - "{{ postgres_config_dir }}/init-matrix.sql:/docker-entrypoint-initdb.d/10-init-matrix.sql:ro"
      - "/var/log/matrix/postgres:/var/log/postgresql"
    command: ["postgres", "-c", "config_file=/tmp/postgresql.conf"]
    shm_size: "512m"
    log_driver: json-file
    log_options:
      max-size: "100m"
      max-file: "5"
    ulimits:
      - nofile:65536:65536
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h {{ postgres_ip }} -p {{ postgres_port }}"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "30s"
    pull: "missing"

- name: Wait for PostgreSQL to accept connections
  command: >
    docker exec matrix-postgres
    pg_isready -U postgres -h {{ postgres_ip }} -p {{ postgres_port }}
  register: pg_ready
  until: pg_ready.rc == 0
  retries: 20
  delay: 3
  changed_when: false

- name: Allow PostgreSQL from Synapse and workers (UFW)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    port: "{{ postgres_port }}"
    proto: tcp
    comment: "PostgreSQL from matrix hosts"
  loop:
    - "{{ synapse_ip }}"
    - "{{ workers_ip }}"
