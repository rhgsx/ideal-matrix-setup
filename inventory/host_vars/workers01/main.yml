---
workers_config_dir: "/etc/matrix-synapse/workers"
workers_log_dir:    "/var/log/matrix-synapse"

# ============================================================
#  WORKERS — разумный минимум для production
#
#  Обязательные синглтоны (нельзя запустить несколько):
#    stream_writer_* — каждый пишет свой поток
#    background_tasks — фоновые задачи
#    event_persister  — запись событий
#    federation_sender — исходящая федерация
#
#  Масштабируемые (по 2 экземпляра):
#    synchrotron    — /sync endpoint
#    generic_worker — клиентские запросы
#
#  Итого: 12 контейнеров
# ============================================================
synapse_workers:

  # ----------------------------------------------------------
  #  SYNCHROTRON — обслуживает /sync (2 шт.)
  # ----------------------------------------------------------
  - name: "synchrotron1"
    app:  "synapse.app.generic_worker"
    worker_name: "synchrotron1"
    port: 8101
    metrics_port: 9201
    listener_resources: [client, federation]

  - name: "synchrotron2"
    app:  "synapse.app.generic_worker"
    worker_name: "synchrotron2"
    port: 8102
    metrics_port: 9202
    listener_resources: [client, federation]

  # ----------------------------------------------------------
  #  FEDERATION READER — входящая федерация (1 шт.)
  # ----------------------------------------------------------
  - name: "federation_reader1"
    app:  "synapse.app.generic_worker"
    worker_name: "federation_reader1"
    port: 8111
    metrics_port: 9211
    listener_resources: [federation]

  # ----------------------------------------------------------
  #  GENERIC WORKERS — клиентские запросы, не /sync (2 шт.)
  # ----------------------------------------------------------
  - name: "generic_worker1"
    app:  "synapse.app.generic_worker"
    worker_name: "generic_worker1"
    port: 8121
    metrics_port: 9221
    listener_resources: [client, federation]

  - name: "generic_worker2"
    app:  "synapse.app.generic_worker"
    worker_name: "generic_worker2"
    port: 8122
    metrics_port: 9222
    listener_resources: [client, federation]

  # ----------------------------------------------------------
  #  MEDIA REPOSITORY — медиа (1 шт.)
  # ----------------------------------------------------------
  - name: "media_repository"
    app:  "synapse.app.media_repository"
    worker_name: "media_repository"
    port: 8131
    metrics_port: 9231
    listener_resources: [media]

  # ----------------------------------------------------------
  #  EVENT PERSISTER — stream_writer для events (1 шт.)
  # ----------------------------------------------------------
  - name: "event_persister1"
    app:  "synapse.app.generic_worker"
    worker_name: "event_persister1"
    port: 8141
    metrics_port: 9241
    listener_resources: [replication]

  # ----------------------------------------------------------
  #  STREAM WRITERS — по одному на каждый поток (4 шт.)
  #  Синглтоны: несколько экземпляров НЕЛЬЗЯ
  # ----------------------------------------------------------
  - name: "stream_writer_typing"
    app:  "synapse.app.generic_worker"
    worker_name: "stream_writer_typing"
    port: 8151
    metrics_port: 9251
    listener_resources: [replication, client]

  - name: "stream_writer_to_device"
    app:  "synapse.app.generic_worker"
    worker_name: "stream_writer_to_device"
    port: 8152
    metrics_port: 9252
    listener_resources: [replication, client]

  - name: "stream_writer_account_data"
    app:  "synapse.app.generic_worker"
    worker_name: "stream_writer_account_data"
    port: 8153
    metrics_port: 9253
    listener_resources: [replication, client]

  - name: "stream_writer_receipts"
    app:  "synapse.app.generic_worker"
    worker_name: "stream_writer_receipts"
    port: 8154
    metrics_port: 9254
    listener_resources: [replication, client]

  # ----------------------------------------------------------
  #  BACKGROUND TASKS — синглтон (1 шт.)
  # ----------------------------------------------------------
  - name: "background_tasks"
    app:  "synapse.app.generic_worker"
    worker_name: "background_tasks"
    port: 8161
    metrics_port: 9261
    listener_resources: [replication]

  # ----------------------------------------------------------
  #  FEDERATION SENDER — исходящая федерация (1 шт.)
  # ----------------------------------------------------------
  - name: "federation_sender1"
    app:  "synapse.app.generic_worker"
    worker_name: "federation_sender1"
    port: 8181
    metrics_port: 9281
    listener_resources: [replication]
