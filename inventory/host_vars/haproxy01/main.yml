---
haproxy_maxconn: 50000
haproxy_nbthread: 4           # = кол-во ядер CPU
haproxy_stats_port: 8404
haproxy_stats_user: "hapadmin"
haproxy_stats_password: "CHANGE_ME"

# Таймауты (мс, если не указан суффикс)
haproxy_timeout_connect:  "5s"
haproxy_timeout_client:   "120s"
haproxy_timeout_server:   "120s"
haproxy_timeout_tunnel:   "3600s"    # для WebSocket (/sync держит соединение)
haproxy_timeout_http_req: "10s"
haproxy_timeout_queue:    "30s"

# Synchrotron — 4 worker process на workers01
synchrotron_workers:
  - { host: "{{ workers_ip }}", port: 8101 }
  - { host: "{{ workers_ip }}", port: 8102 }
  - { host: "{{ workers_ip }}", port: 8103 }
  - { host: "{{ workers_ip }}", port: 8104 }

# Federation reader — 2 worker process
federation_reader_workers:
  - { host: "{{ workers_ip }}", port: 8111 }
  - { host: "{{ workers_ip }}", port: 8112 }

# Generic workers — 4 worker process (клиентские запросы)
generic_workers:
  - { host: "{{ workers_ip }}", port: 8121 }
  - { host: "{{ workers_ip }}", port: 8122 }
  - { host: "{{ workers_ip }}", port: 8123 }
  - { host: "{{ workers_ip }}", port: 8124 }

# Media worker — 1 process
media_workers:
  - { host: "{{ workers_ip }}", port: 8131 }

# MAS (Matrix Authentication Service)
mas_workers:
  - { host: "{{ workers_ip }}", port: "{{ mas_port }}" }
