---
# ============================================================
#  DOMAIN & IDENTITY
# ============================================================
matrix_server_name: "example.com"          # Публичное имя сервера (в MXID: @user:example.com)
matrix_domain: "matrix.example.com"        # Хост, на котором работает Synapse
mas_domain: "auth.example.com"             # Matrix Authentication Service
element_domain: "element.example.com"      # Element Web

# ============================================================
#  INTERNAL NETWORK (все хосты за NAT)
# ============================================================
internal_network: "10.0.1.0/24"

haproxy_ip:   "10.0.1.10"
synapse_ip:   "10.0.1.20"
postgres_ip:  "10.0.1.30"
redis_ip:     "10.0.1.40"
livekit_ip:   "10.0.1.50"
coturn_ip:    "10.0.1.60"
workers_ip:   "10.0.1.70"
element_ip:   "10.0.1.80"

# ============================================================
#  EXTERNAL / NAT ADDRESSES
# ============================================================
external_ip: "203.0.113.10"          # Публичный IP NAT-шлюза
coturn_external_ip: "203.0.113.10"   # Может быть отдельным, если Coturn через другой шлюз

# ============================================================
#  PORTS — главный Synapse
# ============================================================
synapse_http_port:          8008
synapse_https_port:         8448   # federation TLS (если не через HAProxy)
synapse_replication_port:   9093
synapse_metrics_port:       9101

# ============================================================
#  PORTS — Workers (базовые; инкрементируются в роли)
# ============================================================
worker_base_http_port:      8100
worker_base_metrics_port:   9200

# ============================================================
#  DATABASE
# ============================================================
postgres_port:     5432
synapse_db_name:   "synapse"
synapse_db_user:   "synapse"
mas_db_name:       "mas"
mas_db_user:       "mas"

# ============================================================
#  REDIS
# ============================================================
redis_port: 6379
redis_sentinel_port: 26379

# ============================================================
#  LIVEKIT
# ============================================================
livekit_port: 7880          # HTTP/WebSocket
livekit_rtc_port_udp: 7882  # RTC UDP (WebRTC media)
livekit_rtc_port_tcp: 7881  # RTC TCP fallback
livekit_jwt_port: 8181       # livekit-jwt-service

# ============================================================
#  COTURN
# ============================================================
coturn_port:          3478
coturn_tls_port:      5349
coturn_min_port:      49152
coturn_max_port:      65535

# ============================================================
#  MAS
# ============================================================
mas_port: 8090

# ============================================================
#  TLS  (сертификаты хранятся на haproxy01)
# ============================================================
tls_cert_dir:  "/etc/ssl/matrix"
tls_combined:  "/etc/ssl/matrix/combined.pem"   # cert + chain + key в одном файле (haproxy формат)

# ============================================================
#  СИСТЕМНЫЕ ПАКЕТЫ
# ============================================================
common_packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - iotop
  - net-tools
  - iputils-ping
  - dnsutils
  - lsof
  - strace
  - tcpdump
  - fail2ban
  - ufw
  - logrotate
  - chrony
  - python3-pip
  - python3-apt

# ============================================================
#  ВРЕМЕННАЯ ЗОНА
# ============================================================
timezone: "UTC"

# ============================================================
#  ПОЛЬЗОВАТЕЛЬ ДЛЯ СЕРВИСОВ
# ============================================================
matrix_user:  "matrix"
matrix_group: "matrix"
matrix_uid:   990
matrix_gid:   990
